splay:block;font-size:18px;font-weight:650;line-height:1.3}.node-meta{display:block;font-size:12px;color:var(--muted);margin-top:5px}.node .arrow{margin-left:auto;color:var(--branch);font-size:23px;flex:none}.node-num{font-family:Georgia,serif;font-size:23px;color:var(--branch);min-width:27px}.preview{display:flex;gap:0 16px;flex-wrap:wrap;border-left:1px solid var(--line);margin-left:24px;padding:8px 0 0 15px}.preview a{font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent}.preview a:hover{border-color:currentColor}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:24px 0}.toolbar button,.toolbar .button{font-size:13px}.toolbar .primary{background:var(--ink);color:white;border-color:var(--ink)}.aside-link{padding:18px 0;margin-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}.aside-link a{text-decoration:underline;text-underline-offset:4px}.aside-link p{margin:0;max-width:700px}.reading{max-width:800px;margin:0 auto}.quote{margin:20px 0 24px;border-left:3px solid var(--accent);padding:26px 28px;background:var(--white);font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}.quote.frontmatter{font-family:inherit;font-size:15px;line-height:1.75}.source-line{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:18px 0}.source-line a{text-decoration:underline;text-underline-offset:3px}.leaf-flow{display:flex;gap:8px;justify-content:space-between;margin:28px 0}.leaf-flow a{font-size:13px}.note-box{border-top:1px solid var(--line);padding-top:24px;margin-top:26px}.note-box label{display:block;font-size:15px;font-weight:650;margin:0 0 9px}textarea{width:100%;min-height:115px;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:var(--white);line-height:1.5}.note-box .small{mar eX(-50%);max-width:90vw;padding:13px 20px;background:var(--ink);color:white;border-radius:5px;z-index:10;font-size:14px}.empty{padding:35px 0}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}

</style></head><body><header><div class="topbar"><a href="#home" class="brand">SCRUM <span>/ 2020</span></a><nav aria-label="Main navigation"><a href="#home">Map</a><a href="#pages">Pages</a><a href="#saved">Saved<span id="saved-count"></span></a><a href="#search">Find</a><a href="#help">Help</a></nav><span class="status" id="offline-status" role="status">Preparing offline copy…</span></div></header><main id="main" tabindex="-1"></main><noscript><p>This mind map needs JavaScript. <a href="https://scrumguides.org/scrum-guide.html">Read the official Guide here.</a></p></noscript><footer class="footer"><p>Scrum Guide © 2020 Ken Schwaber & Jeff Sutherland · <a href="https://scrumguides.org/">Original Guide</a><br>Guide and visual adaptation: <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. Navigation labels are editorial; passage text is original.</p><div><a href="#help">About this map</a> · <a href="https://github.com/himansh1/scrum-guide-map">GitHub</a></div></footer><input type="file" id="import-file" accept="application/json,.json" hidden><div id="toast" class="toast" role="status" hidden></div><script type="application/json" id="guide-data">{"nodes":{"b012":{"id":"b012","title":"A lightweight framework for complex problems","text":"Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems.","pages":[3],"refs":["b012"],"kind":"text","parent":"scrum-definition","color":"#286059","leafCount":1},"b013":{"id":"b013","title":"The Scrum Master’s environment","text":"In a nutshell, Scrum requires a Scrum Master to foster an environment where:","pages":[3],"refs":["b013"],"kind":"text","parent":"scrum-in-a-nutshell","color":"#286059","leafCount":1},"b014":{"id":"b014","title":"1 · Order the Product Backlog","text":"1. A Product Owner orders the work for a complex problem into a Product Backlog.","pages":[3],"refs":["b014"],"kind":"text","parent":"scrum-in-a-nutshell","color":"#286059","leafCount":1},"b015":{"id":"b015","title":"2 · Create an Increment in a Sprint","text":"2. The Scrum Team turns a selection of the work into an Increment of value during a Sprint.","pages":[3],"refs":["b015"],"kind":"text","parent":"scrum-in-a-nutshell","color":"#286059","leafCount":1},"b016":{"id":"b016","title":"3 · Inspect and adjust","text":"3. The Scrum Team and its stakeholders inspect the results and adjust for the next Sprint.","pages":[3],"refs":["b016"],"kind":"text","parent":"scrum-in-a-nutshell","color":"#286059","leafCount":1},"b017":{"id":"b017","title":"4 · Repeat","text":"4. Repeat","pages":[3],"refs":["b017"],"kind":"text","parent":"scrum-in-a-nutshell","color":"#286059","leafCount":1},"scrum-in-a-nutshell":{"id":"scrum-in-a-nutshell","title":"Scrum in a nutshell","children":["b013","b014","b015","b016","b017"],"refs":[],"parent":"scrum-definition","color":"#286059","pages":[3],"leafCount":5},"b018":{"id":"b018","title":"Simple and purposefully incomplete","text":"Scrum is simple. Try it as is and determine if its philosophy, theory, and structure help to achieve goals and create value. The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory. Scrum is built upon by the collective intelligence of the people using it. Rather than provide people with detailed instructions, the rules of Scrum guide their relationships and interactions.","pages":[3],"refs":["b018"],"kind":"text","parent":"scrum-definition","color":"#286059","leafCount":1},"b019":{"id":"b019","title":"Processes, techniques and methods","text":"Various processes, techniques and methods can be employed within the framework. Scrum wraps around existing practices or renders them unnecessary. Scrum makes visible the relative efficacy of current management, environment, and work techniques, so that improvements can be made.","pages":[3],"refs":["b019"],"kind":"text","parent":"scrum-definition","color":"#286059","leafCount":1},"scrum-definition":{"id":"scrum-definition","title":"Scrum Definition","children":["b012","scrum-in-a-nutshell","b018","b019"],"refs":["b011"],"parent":"fundamentals","color":"#286059","pages":[3],"leafCount":8},"b021":{"id":"b021","title":"Empiricism and lean thinking","text":"Scrum is founded on empiricism and lean thinking. Empiricism asserts that knowledge comes from experience and making decisions based on what is observed. Lean thinking reduces waste and focuses on the essentials.","pages":[3],"refs":["b021"],"kind":"text","parent":"scrum-theory","color":"#286059","leafCount":1},"b022":{"id":"b022","title":"Iterative and incremental work","text":"Scrum employs an iterative, incremental approach to optimize predictability and to control risk. Scrum engages groups of people who collectively have all the skills and expertise to do the work and share or acquire such skills as needed.","pages":[3],"refs":["b022"],"kind":"text","parent":"scrum-theory","color":"#286059","leafCount":1},"b023":{"id":"b023","title":"Events and the three pillars","text":"Scrum combines four formal events for inspection and adaptation within a containing event, the Sprint. These events work because they implement the empirical Scrum pillars of transparency, inspection, and adaptation.","pages":[3],"refs":["b023"],"kind":"text","parent":"scrum-theory","color":"#286059","leafCount":1},"b025":{"id":"b025","title":"Visibility of work and artifacts","text":"The emergent process and work must be visible to those performing the work as well as those receiving the work. With Scrum, important decisions are based on the perceived state of its three formal artifacts. Artifacts that have low transparency can lead to decisions that diminish value and increase risk.","pages":[3],"refs":["b025"],"kind":"text","parent":"transparency","color":"#286059","leafCount":1},"b026":{"id":"b026","title":"Transparency enables inspection","text":"Transparency enables inspection. Inspection without transparency is misleading and wasteful.","pages":[4],"refs":["b026"],"kind":"text","parent":"transparency","color":"#286059","leafCount":1},"transparency":{"id":"transparency","title":"Transparency","children":["b025","b026"],"refs":["b024"],"parent":"scrum-theory","color":"#286059","pages":[3,4],"leafCount":2},"b028":{"id":"b028","title":"Inspect artifacts and progress","text":"The Scrum artifacts and the progress toward agreed goals must be inspected frequently and diligently to detect potentially undesirable variances or problems. To help with inspection, Scrum provides cadence in the form of its five events.","pages":[4],"refs":["b028"],"kind":"text","parent":"inspection","color":"#286059","leafCount":1},"b029":{"id":"b029","title":"Inspection enables adaptation","text":"Inspection enables adaptation. Inspection without adaptation is considered pointless. Scrum events are designed to provoke change.","pages":[4],"refs":["b029"],"kind":"text","parent":"inspection","color":"#286059","leafCount":1},"inspection":{"id":"inspection","title":"Inspection","children":["b028","b029"],"refs":["b027"],"parent":"scrum-theory","color":"#286059","pages":[4],"leafCount":2},"b031":{"id":"b031","title":"Adjust as soon as possible","text":"If any aspects of a process deviate outside acceptable limits or if the resulting product is unacceptable, the process being applied or the materials being produced must be adjusted. The adjustment must be made as soon as possible to minimize further deviation.","pages":[4],"refs":["b031"],"kind":"text","parent":"adaptation","color":"#286059","leafCount":1},"b032":{"id":"b032","title":"Empowerment and self-management","text":"Adaptation becomes more difficult when the people involved are not empowered or self-managing. A Scrum Team is expected to adapt the moment it learns anything new through inspection.","pages":[4],"refs":["b032"],"kind":"text","parent":"adaptation","color":"#286059","leafCount":1},"adaptation":{"id":"adaptation","title":"Adaptation","children":["b031","b032"],"refs":["b030"],"parent":"scrum-theory","color":"#286059","pages":[4],"leafCount":2},"scrum-theory":{"id":"scrum-theory","title":"Scrum Theory","children":["b021","b022","b023","transparency","inspection","adaptation"],"refs":["b020"],"parent":"fundamentals","color":"#286059","pages":[3,4],"leafCount":9},"fundamentals":{"id":"fundamentals","title":"Fundamentals / theory","children":["scrum-definition","scrum-theory"],"refs":[],"color":"#286059","parent":"home","pages":[3,4],"leafCount":17},"b036-1":{"id":"b036-1","title":"Commitment","text":"The Scrum Team commits to achieving its goals and to supporting each other.","pages":[4],"refs":["b036"],"slice":0,"parent":"the-values-in-practice","color":"#9b6427","leafCount":1},"b036-2":{"id":"b036-2","title":"Focus","text":"Their primary focus is on the work of the Sprint to make the best possible progress toward these goals.","pages":[4],"refs":["b036"],"slice":1,"parent":"the-values-in-practice","color":"#9b6427","leafCount":1},"b036-3":{"id":"b036-3","title":"Openness","text":"The Scrum Team and its stakeholders are open about the work and the challenges.","pages":[4],"refs":["b036"],"slice":2,"parent":"the-values-in-practice","color":"#9b6427","leafCount":1},"b036-4":{"id":"b036-4","title":"Respect","text":"Scrum Team members respect each other to be capable, independent people, and are respected as such by the people with whom they work.","pages":[4],"refs":["b036"],"slice":3,"parent":"the-values-in-practice","color":"#9b6427","leafCount":1},"b036-5":{"id":"b036-5","title":"Courage","text":"The Scrum Team members have the courage to do the right thing, to work on tough problems.","pages":[4],"refs":["b036"],"slice":4,"parent":"the-values-in-practice","color":"#9b6427","leafCount":1},"b034":{"id":"b034","title":"Living the values","text":"Successful use of Scrum depends on people becoming more proficient in living five values:","pages":[4],"refs":["b034"],"kind":"text","parent":"scrum-values","color":"#9b6427","leafCount":1},"b035":{"id":"b035","title":"The five values","text":"Commitment, Focus, Openness, Respect, and Courage","pages":[4],"refs":["b035"],"kind":"text","parent":"scrum-values","color":"#9b6427","leafCount":1},"the-values-in-practice":{"id":"the-values-in-practice","title":"The values in practice","children":["b036-1","b036-2","b036-3","b036-4","b036-5"],"refs":[],"parent":"scrum-values","color":"#9b6427","pages":[4],"leafCount":5},"b037":{"id":"b037","title":"Behavior, empiricism and trust","text":"These values give direction to the Scrum Team with regard to their work, actions, and behavior. The decisions that are made, the steps taken, and the way Scrum is used should reinforce these values, not diminish or undermine them. The Scrum Team members learn and explore the values as they work with the Scrum events and artifacts. When these values are embodied by the Scrum Team and the people they work with, the empirical Scrum pillars of transparency, inspection, and adaptation come to life building trust.","pages":[4],"refs":["b037"],"kind":"text","parent":"scrum-values","color":"#9b6427","leafCount":1},"scrum-values":{"id":"scrum-values","title":"Scrum Values","children":["b034","b035","the-values-in-practice","b037"],"refs":["b033"],"color":"#9b6427","parent":"home","pages":[4],"leafCount":8},"b045":{"id":"b045","title":"Who the Developers are","text":"Developers are the people in the Scrum Team that are committed to creating any aspect of a usable Increment each Sprint.","pages":[5],"refs":["b045"],"kind":"text","parent":"developers","color":"#344f8e","leafCount":1},"b046":{"id":"b046","title":"Skills vary; accountabilities remain","text":"The specific skills needed by the Developers are often broad and will vary with the domain of work. However, the Developers are always accountable for:","pages":[5],"refs":["b046"],"kind":"text","parent":"developers-accountabilities","color":"#344f8e","leafCount":1},"b047":{"id":"b047","title":"Create the Sprint Backlog","text":"● Creating a plan for the Sprint, the Sprint Backlog;","pages":[5],"refs":["b047"],"kind":"text","parent":"developers-accountabilities","color":"#344f8e","leafCount":1},"b048":{"id":"b048","title":"Adhere to the Definition of Done","text":"● Instilling quality by adhering to a Definition of Done;","pages":[5],"refs":["b048"],"kind":"text","parent":"developers-accountabilities","color":"#344f8e","leafCount":1},"b049":{"id":"b049","title":"Adapt toward the Sprint Goal","text":"● Adapting their plan each day toward the Sprint Goal; and,","pages":[5],"refs":["b049"],"kind":"text","parent":"developers-accountabilities","color":"#344f8e","leafCount":1},"b050":{"id":"b050","title":"Hold each other accountable","text":"● Holding each other accountable as professionals.","pages":[5],"refs":["b050"],"kind":"text","parent":"developers-accountabilities","color":"#344f8e","leafCount":1},"developers-accountabilities":{"id":"developers-accountabilities","title":"Developers’ accountabilities","children":["b046","b047","b048","b049","b050"],"refs":[],"parent":"developers","color":"#344f8e","pages":[5],"leafCount":5},"developers":{"id":"developers","title":"Developers","children":["b045","developers-accountabilities"],"refs":["b044"],"parent":"scrum-team","color":"#344f8e","pages":[5],"leafCount":6},"b052":{"id":"b052","title":"Maximize product value","text":"The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team. How this is done may vary widely across organizations, Scrum Teams, and individuals.","pages":[5],"refs":["b052"],"kind":"text","parent":"product-owner","color":"#344f8e","leafCount":1},"b053":{"id":"b053","title":"Effective backlog management","text":"The Product Owner is also accountable for effective Product Backlog management, which includes:","pages":[6],"refs":["b053"],"kind":"text","parent":"product-backlog-management","color":"#344f8e","leafCount":1},"b054":{"id":"b054","title":"Communicate the Product Goal","text":"● Developing and explicitly communicating the Product Goal;","pages":[6],"refs":["b054"],"kind":"text","parent":"product-backlog-management","color":"#344f8e","leafCount":1},"b055":{"id":"b055","title":"Communicate Product Backlog items","text":"● Creating and clearly communicating Product Backlog items;","pages":[6],"refs":["b055"],"kind":"text","parent":"product-backlog-management","color":"#344f8e","leafCount":1},"b056":{"id":"b056","title":"Order Product Backlog items","text":"● Ordering Product Backlog items; and,","pages":[6],"refs":["b056"],"kind":"text","parent":"product-backlog-management","color":"#344f8e","leafCount":1},"b057":{"id":"b057","title":"Make the backlog transparent","text":"● Ensuring that the Product Backlog is transparent, visible and understood.","pages":[6],"refs":["b057"],"kind":"text","parent":"product-backlog-management","color":"#344f8e","leafCount":1},"product-backlog-management":{"id":"product-backlog-management","title":"Product Backlog management","children":["b053","b054","b055","b056","b057"],"refs":[],"parent":"product-owner","color":"#344f8e","pages":[6],"leafCount":5},"b058":{"id":"b058","title":"Delegation retains accountability","text":"The Product Owner may do the above work or may delegate the responsibility to others. Regardless, the Product Owner remains accountable.","pages":[6],"refs":["b058"],"kind":"text","parent":"authority-and-accountability","color":"#344f8e","leafCount":1},"b059":{"id":"b059","title":"Respect the Product Owner’s decisions","text":"For Product Owners to succeed, the entire organization must respect their decisions. These decisions are visible in the content and ordering of the Product Backlog, and through the inspectable Increment at the Sprint Review.","pages":[6],"refs":["b059"],"kind":"text","parent":"authority-and-accountability","color":"#344f8e","leafCount":1},"b060":{"id":"b060","title":"One person; represent stakeholders","text":"The Product Owner is one person, not a committee. The Product Owner may represent the needs of many stakeholders in the Product Backlog. Those wanting to change the Product Backlog can do so by trying to convince the Product Owner.","pages":[6],"refs":["b060"],"kind":"text","parent":"authority-and-accountability","color":"#344f8e","leafCount":1},"authority-and-accountability":{"id":"authority-and-accountability","title":"Authority and accountability","children":["b058","b059","b060"],"refs":[],"parent":"product-owner","color":"#344f8e","pages":[6],"leafCount":3},"product-owner":{"id":"product-owner","title":"Product Owner","children":["b052","product-backlog-management","authority-and-accountability"],"refs":["b051"],"parent":"scrum-team","color":"#344f8e","pages":[5,6],"leafCount":9},"b062":{"id":"b062","title":"Establish Scrum","text":"The Scrum Master is accountable for establishing Scrum as defined in the Scrum Guide. They do this by helping everyone understand Scrum theory and practice, both within the Scrum Team and the organization.","pages":[6],"refs":["b062"],"kind":"text","parent":"purpose-and-leadership","color":"#344f8e","leafCount":1},"b063":{"id":"b063","title":"Enable team effectiveness","text":"The Scrum Master is accountable for the Scrum Team’s effectiveness. They do this by enabling the Scrum Team to improve its practices, within the Scrum framework.","pages":[6],"refs":["b063"],"kind":"text","parent":"purpose-and-leadership","color":"#344f8e","leafCount":1},"b064":{"id":"b064","title":"True leaders who serve","text":"Scrum Masters are true leaders who serve the Scrum Team and the larger organization.","pages":[6],"refs":["b064"],"kind":"text","parent":"purpose-and-leadership","color":"#344f8e","leafCount":1},"purpose-and-leadership":{"id":"purpose-and-leadership","title":"Purpose and leadership","children":["b062","b063","b064"],"refs":[],"parent":"scrum-master","color":"#344f8e","pages":[6],"leafCount":3},"b065":{"id":"b065","title":"Ways to serve the Scrum Team","text":"The Scrum Master serves the Scrum Team in several ways, including:","pages":[6],"refs":["b065"],"kind":"text","parent":"service-to-the-scrum-team","color":"#344f8e","leafCount":1},"b066":{"id":"b066","title":"Coach self-management","text":"● Coaching the team members in self-management and cross-functionality;","pages":[6],"refs":["b066"],"kind":"text","parent":"service-to-the-scrum-team","color":"#344f8e","leafCount":1},"b067":{"id":"b067","title":"Focus on high-value, Done Increments","text":"● Helping the Scrum Team focus on creating high-value Increments that meet the Definition of Done;","pages":[6],"refs":["b067"],"kind":"text","parent":"service-to-the-scrum-team","color":"#344f8e","leafCount":1},"b068":{"id":"b068","title":"Cause removal of impediments","text":"● Causing the removal of impediments to the Scrum Team’s progress; and,","pages":[6],"refs":["b068"],"kind":"text","parent":"service-to-the-scrum-team","color":"#344f8e","leafCount":1},"b069":{"id":"b069","title":"Ensure effective events","text":"● Ensuring that all Scrum events take place and are positive, productive, and kept within the timebox.","pages":[6],"refs":["b069"],"kind":"text","parent":"service-to-the-scrum-team","color":"#344f8e","leafCount":1},"service-to-the-scrum-team":{"id":"service-to-the-scrum-team","title":"Service to the Scrum Team","children":["b065","b066","b067","b068","b069"],"refs":[],"parent":"scrum-master","color":"#344f8e","pages":[6],"leafCount":5},"b070":{"id":"b070","title":"Ways to serve the Product Owner","text":"The Scrum Master serves the Product Owner in several ways, including:","pages":[6],"refs":["b070"],"kind":"text","parent":"service-to-the-product-owner","color":"#344f8e","leafCount":1},"b071":{"id":"b071","title":"Product Goal and backlog techniques","text":"● Helping find techniques for effective Product Goal definition and Product Backlog management;","pages":[7],"refs":["b071"],"kind":"text","parent":"service-to-the-product-owner","color":"#344f8e","leafCount":1},"b072":{"id":"b072","title":"Clear and concise backlog items","text":"● Helping the Scrum Team understand the need for clear and concise Product Backlog items;","pages":[7],"refs":["b072"],"kind":"text","parent":"service-to-the-product-owner","color":"#344f8e","leafCount":1},"b073":{"id":"b073","title":"Empirical product planning","text":"● Helping establish empirical product planning for a complex environment; and,","pages":[7],"refs":["b073"],"kind":"text","parent":"service-to-the-product-owner","color":"#344f8e","leafCount":1},"b074":{"id":"b074","title":"Stakeholder collaboration","text":"● Facilitating stakeholder collaboration as requested or needed.","pages":[7],"refs":["b074"],"kind":"text","parent":"service-to-the-product-owner","color":"#344f8e","leafCount":1},"service-to-the-product-owner":{"id":"service-to-the-product-owner","title":"Service to the Product Owner","children":["b070","b071","b072","b073","b074"],"refs":[],"parent":"scrum-master","color":"#344f8e","pages":[6,7],"leafCount":5},"b075":{"id":"b075","title":"Ways to serve the organization","text":"The Scrum Master serves the organization in several ways, including:","pages":[7],"refs":["b075"],"kind":"text","parent":"service-to-the-organization","color":"#344f8e","leafCount":1},"b076":{"id":"b076","title":"Lead, train and coach","text":"● Leading, training, and coaching the organization in its Scrum adoption;","pages":[7],"refs":["b076"],"kind":"text","parent":"service-to-the-organization","color":"#344f8e","leafCount":1},"b077":{"id":"b077","title":"Advise Scrum implementations","text":"● Planning and advising Scrum implementations within the organization;","pages":[7],"refs":["b077"],"kind":"text","parent":"service-to-the-organization","color":"#344f8e","leafCount":1},"b078":{"id":"b078","title":"Enable an empirical approach","text":"● Helping employees and stakeholders understand and enact an empirical approach for complex work; and,","pages":[7],"refs":["b078"],"kind":"text","parent":"service-to-the-organization","color":"#344f8e","leafCount":1},"b079":{"id":"b079","title":"Remove stakeholder barriers","text":"● Removing barriers between stakeholders and Scrum Teams.","pages":[7],"refs":["b079"],"kind":"text","parent":"service-to-the-organization","color":"#344f8e","leafCount":1},"service-to-the-organization":{"id":"service-to-the-organization","title":"Service to the organization","children":["b075","b076","b077","b078","b079"],"refs":[],"parent":"scrum-master","color":"#344f8e","pages":[7],"leafCount":5},"scrum-master":{"id":"scrum-master","title":"Scrum Master","children":["purpose-and-leadership","service-to-the-scrum-team","service-to-the-product-owner","service-to-the-organization"],"refs":["b061"],"parent":"scrum-team","color":"#344f8e","pages":[6,7],"leafCount":18},"b039":{"id":"b039","title":"One cohesive team","text":"The fundamental unit of Scrum is a small team of people, a Scrum Team. The Scrum Team consists of one Scrum Master, one Product Owner, and Developers. Within a Scrum Team, there are no sub-teams or hierarchies. It is a cohesive unit of professionals focused on one objective at a time, the Product Goal.","pages":[5],"refs":["b039"],"kind":"text","parent":"team-structure-and-responsibilities","color":"#344f8e","leafCount":1},"b040":{"id":"b040","title":"Cross-functional and self-managing","text":"Scrum Teams are cross-functional, meaning the members have all the skills necessary to create value each Sprint. They are also self-managing, meaning they internally decide who does what, when, and how.","pages":[5],"refs":["b040"],"kind":"text","parent":"team-structure-and-responsibilities","color":"#344f8e","leafCount":1},"b041":{"id":"b041","title":"Team size and multiple teams","text":"The Scrum Team is small enough to remain nimble and large enough to complete significant work within a Sprint, typically 10 or fewer people. In general, we have found that smaller teams communicate better and are more productive. If Scrum Teams become too large, they should consider reorganizing into multiple cohesive Scrum Teams, each focused on the same product. Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.","pages":[5],"refs":["b041"],"kind":"text","parent":"team-structure-and-responsibilities","color":"#344f8e","leafCount":1},"b042":{"id":"b042","title":"All product-related activities","text":"The Scrum Team is responsible for all product-related activities from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required. They are structured and empowered by the organization to manage their own work. Working in Sprints at a sustainable pace improves the Scrum Team’s focus and consistency.","pages":[5],"refs":["b042"],"kind":"text","parent":"team-structure-and-responsibilities","color":"#344f8e","leafCount":1},"b043":{"id":"b043","title":"A valuable, useful Increment","text":"The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint. Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.","pages":[5],"refs":["b043"],"kind":"text","parent":"team-structure-and-responsibilities","color":"#344f8e","leafCount":1},"team-structure-and-responsibilities":{"id":"team-structure-and-responsibilities","title":"Team structure and responsibilities","children":["b039","b040","b041","b042","b043"],"refs":[],"parent":"scrum-team","color":"#344f8e","pages":[5],"leafCount":5},"scrum-team":{"id":"scrum-team","title":"Scrum Team","children":["team-structure-and-responsibilities","developers","product-owner","scrum-master"],"refs":["b038"],"color":"#344f8e","parent":"home","pages":[5,6,7],"leafCount":38},"b083":{"id":"b083","title":"Ideas become value","text":"Sprints are the heartbeat of Scrum, where ideas are turned into value.","pages":[7],"refs":["b083"],"kind":"text","parent":"purpose-duration-and-scope","color":"#a1493e","leafCount":1},"b084":{"id":"b084","title":"One month or less; immediate next Sprint","text":"They are fixed length events of one month or less to create consistency. A new Sprint starts immediately after the conclusion of the previous Sprint.","pages":[7],"refs":["b084"],"kind":"text","parent":"purpose-duration-and-scope","color":"#a1493e","leafCount":1},"b085":{"id":"b085","title":"All work happens within Sprints","text":"All the work necessary to achieve the Product Goal, including Sprint Planning, Daily Scrums, Sprint Review, and Sprint Retrospective, happen within Sprints.","pages":[7],"refs":["b085"],"kind":"text","parent":"purpose-duration-and-scope","color":"#a1493e","leafCount":1},"purpose-duration-and-scope":{"id":"purpose-duration-and-scope","title":"Purpose, duration and scope","children":["b083","b084","b085"],"refs":[],"parent":"the-sprint","color":"#a1493e","pages":[7],"leafCount":3},"b086":{"id":"b086","title":"The Sprint’s constraints","text":"During the Sprint:","pages":[7],"refs":["b086"],"kind":"text","parent":"during-the-sprint","color":"#a1493e","leafCount":1},"b087":{"id":"b087","title":"Protect the Sprint Goal","text":"● No changes are made that would endanger the Sprint Goal;","pages":[7],"refs":["b087"],"kind":"text","parent":"during-the-sprint","color":"#a1493e","leafCount":1},"b088":{"id":"b088","title":"Quality does not decrease","text":"● Quality does not decrease;","pages":[7],"refs":["b088"],"kind":"text","parent":"during-the-sprint","color":"#a1493e","leafCount":1},"b089":{"id":"b089","title":"Refine the Product Backlog","text":"● The Product Backlog is refined as needed; and,","pages":[7],"refs":["b089"],"kind":"text","parent":"during-the-sprint","color":"#a1493e","leafCount":1},"b090":{"id":"b090","title":"Clarify and renegotiate scope","text":"● Scope may be clarified and renegotiated with the Product Owner as more is learned.","pages":[7],"refs":["b090"],"kind":"text","parent":"during-the-sprint","color":"#a1493e","leafCount":1},"during-the-sprint":{"id":"during-the-sprint","title":"During the Sprint","children":["b086","b087","b088","b089","b090"],"refs":[],"parent":"the-sprint","color":"#a1493e","pages":[7],"leafCount":5},"b091":{"id":"b091","title":"Predictability, shorter cycles and risk","text":"Sprints enable predictability by ensuring inspection and adaptation of progress toward a Product Goal at least every calendar month. When a Sprint’s horizon is too long the Sprint Goal may become invalid, complexity may rise, and risk may increase. Shorter Sprints can be employed to generate more learning cycles and limit risk of cost and effort to a smaller time frame. Each Sprint may be considered a short project.","pages":[7,8],"refs":["b091"],"kind":"text","parent":"the-sprint","color":"#a1493e","leafCount":1},"b092":{"id":"b092","title":"Forecasting and empiricism","text":"Various practices exist to forecast progress, like burn-downs, burn-ups, or cumulative flows. While proven useful, these do not replace the importance of empiricism. In complex environments, what will happen is unknown. Only what has already happened may be used for forward-looking decision making.","pages":[8],"refs":["b092"],"kind":"text","parent":"the-sprint","color":"#a1493e","leafCount":1},"b093":{"id":"b093","title":"Cancellation authority","text":"A Sprint could be cancelled if the Sprint Goal becomes obsolete. Only the Product Owner has the authority to cancel the Sprint.","pages":[8],"refs":["b093"],"kind":"text","parent":"the-sprint","color":"#a1493e","leafCount":1},"the-sprint":{"id":"the-sprint","title":"The Sprint","children":["purpose-duration-and-scope","during-the-sprint","b091","b092","b093"],"refs":["b082"],"parent":"scrum-events","color":"#a1493e","pages":[7,8],"leafCount":11},"b095":{"id":"b095","title":"Collaborative planning","text":"Sprint Planning initiates the Sprint by laying out the work to be performed for the Sprint. This resulting plan is created by the collaborative work of the entire Scrum Team.","pages":[8],"refs":["b095"],"kind":"text","parent":"sprint-planning","color":"#a1493e","leafCount":1},"b096":{"id":"b096","title":"Preparation and invited advisers","text":"The Product Owner ensures that attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal. The Scrum Team may also invite other people to attend Sprint Planning to provide advice.","pages":[8],"refs":["b096"],"kind":"text","parent":"sprint-planning","color":"#a1493e","leafCount":1},"b097":{"id":"b097","title":"Three planning topics","text":"Sprint Planning addresses the following topics:","pages":[8],"refs":["b097"],"kind":"text","parent":"sprint-planning","color":"#a1493e","leafCount":1},"b099":{"id":"b099","title":"Define and finalize the Sprint Goal","text":"The Product Owner proposes how the product could increase its value and utility in the current Sprint. The whole Scrum Team then collaborates to define a Sprint Goal that communicates why the Sprint is valuable to stakeholders. The Sprint Goal must be finalized prior to the end of Sprint Planning.","pages":[8],"refs":["b099"],"kind":"text","parent":"topic-one-why-is-this-sprint-valuable","color":"#a1493e","leafCount":1},"topic-one-why-is-this-sprint-valuable":{"id":"topic-one-why-is-this-sprint-valuable","title":"Topic One: Why is this Sprint valuable?","children":["b099"],"refs":["b098"],"parent":"sprint-planning","color":"#a1493e","pages":[8],"leafCount":1},"b101":{"id":"b101","title":"Developers select work","text":"Through discussion with the Product Owner, the Developers select items from the Product Backlog to include in the current Sprint. The Scrum Team may refine these items during this process, which increases understanding and confidence.","pages":[8],"refs":["b101"],"kind":"text","parent":"topic-two-what-can-be-done-this-sprint","color":"#a1493e","leafCount":1},"b102":{"id":"b102","title":"Forecast using performance, capacity and Done","text":"Selecting how much can be completed within a Sprint may be challenging. However, the more the Developers know about their past performance, their upcoming capacity, and their Definition of Done, the more confident they will be in their Sprint forecasts.","pages":[8],"refs":["b102"],"kind":"text","parent":"topic-two-what-can-be-done-this-sprint","color":"#a1493e","leafCount":1},"topic-two-what-can-be-done-this-sprint":{"id":"topic-two-what-can-be-done-this-sprint","title":"Topic Two: What can be Done this Sprint?","children":["b101","b102"],"refs":["b100"],"parent":"sprint-planning","color":"#a1493e","pages":[8],"leafCount":2},"b104":{"id":"b104","title":"Developers plan delivery","text":"For each selected Product Backlog item, the Developers plan the work necessary to create an Increment that meets the Definition of Done. This is often done by decomposing Product Backlog items into smaller work items of one day or less. How this is done is at the sole discretion of the Developers. No one else tells them how to turn Product Backlog items into Increments of value.","pages":[8],"refs":["b104"],"kind":"text","parent":"topic-three-how-will-the-chosen-work-get-done","color":"#a1493e","leafCount":1},"topic-three-how-will-the-chosen-work-get-done":{"id":"topic-three-how-will-the-chosen-work-get-done","title":"Topic Three: How will the chosen work get done?","children":["b104"],"refs":["b103"],"parent":"sprint-planning","color":"#a1493e","pages":[8],"leafCount":1},"b105":{"id":"b105","title":"The resulting Sprint Backlog","text":"The Sprint Goal, the Product Backlog items selected for the Sprint, plus the plan for delivering them are together referred to as the Sprint Backlog.","pages":[9],"refs":["b105"],"kind":"text","parent":"sprint-planning","color":"#a1493e","leafCount":1},"b106":{"id":"b106","title":"Timebox: maximum eight hours","text":"Sprint Planning is timeboxed to a maximum of eight hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.","pages":[9],"refs":["b106"],"kind":"text","parent":"sprint-planning","color":"#a1493e","leafCount":1},"sprint-planning":{"id":"sprint-planning","title":"Sprint Planning","children":["b095","b096","b097","topic-one-why-is-this-sprint-valuable","topic-two-what-can-be-done-this-sprint","topic-three-how-will-the-chosen-work-get-done","b105","b106"],"refs":["b094"],"parent":"scrum-events","color":"#a1493e","pages":[8,9],"leafCount":9},"b108":{"id":"b108","title":"Inspect progress and adapt the plan","text":"The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.","pages":[9],"refs":["b108"],"kind":"text","parent":"daily-scrum","color":"#a1493e","leafCount":1},"b109":{"id":"b109","title":"15 minutes; Developers participate","text":"The Daily Scrum is a 15-minute event for the Developers of the Scrum Team. To reduce complexity, it is held at the same time and place every working day of the Sprint. If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.","pages":[9],"refs":["b109"],"kind":"text","parent":"daily-scrum","color":"#a1493e","leafCount":1},"b110":{"id":"b110","title":"Choose structure; create an actionable plan","text":"The Developers can select whatever structure and techniques they want, as long as their Daily Scrum focuses on progress toward the Sprint Goal and produces an actionable plan for the next day of work. This creates focus and improves self-management.","pages":[9],"refs":["b110"],"kind":"text","parent":"daily-scrum","color":"#a1493e","leafCount":1},"b111":{"id":"b111","title":"Communication and decisions","text":"Daily Scrums improve communications, identify impediments, promote quick decision-making, and consequently eliminate the need for other meetings.","pages":[9],"refs":["b111"],"kind":"text","parent":"daily-scrum","color":"#a1493e","leafCount":1},"b112":{"id":"b112","title":"Adapt throughout the day","text":"The Daily Scrum is not the only time Developers are allowed to adjust their plan. They often meet throughout the day for more detailed discussions about adapting or re-planning the rest of the Sprint’s work.","pages":[9],"refs":["b112"],"kind":"text","parent":"daily-scrum","color":"#a1493e","leafCount":1},"daily-scrum":{"id":"daily-scrum","title":"Daily Scrum","children":["b108","b109","b110","b111","b112"],"refs":["b107"],"parent":"scrum-events","color":"#a1493e","pages":[9],"leafCount":5},"b114":{"id":"b114","title":"Inspect outcome with stakeholders","text":"The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations. The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.","pages":[9],"refs":["b114"],"kind":"text","parent":"sprint-review","color":"#a1493e","leafCount":1},"b115":{"id":"b115","title":"Collaborate on future adaptations","text":"During the event, the Scrum Team and stakeholders review what was accomplished in the Sprint and what has changed in their environment. Based on this information, attendees collaborate on what to do next. The Product Backlog may also be adjusted to meet new opportunities. The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.","pages":[9],"refs":["b115"],"kind":"text","parent":"sprint-review","color":"#a1493e","leafCount":1},"b116":{"id":"b116","title":"Timebox: maximum four hours","text":"The Sprint Review is the second to last event of the Sprint and is timeboxed to a maximum of four hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.","pages":[9],"refs":["b116"],"kind":"text","parent":"sprint-review","color":"#a1493e","leafCount":1},"sprint-review":{"id":"sprint-review","title":"Sprint Review","children":["b114","b115","b116"],"refs":["b113"],"parent":"scrum-events","color":"#a1493e","pages":[9],"leafCount":3},"b118":{"id":"b118","title":"Improve quality and effectiveness","text":"The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.","pages":[10],"refs":["b118"],"kind":"text","parent":"sprint-retrospective","color":"#a1493e","leafCount":1},"b119":{"id":"b119","title":"Inspect the last Sprint","text":"The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done. Inspected elements often vary with the domain of work. Assumptions that led them astray are identified and their origins explored. The Scrum Team discusses what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved.","pages":[10],"refs":["b119"],"kind":"text","parent":"sprint-retrospective","color":"#a1493e","leafCount":1},"b120":{"id":"b120","title":"Address impactful improvements","text":"The Scrum Team identifies the most helpful changes to improve its effectiveness. The most impactful improvements are addressed as soon as possible. They may even be added to the Sprint Backlog for the next Sprint.","pages":[10],"refs":["b120"],"kind":"text","parent":"sprint-retrospective","color":"#a1493e","leafCount":1},"b121":{"id":"b121","title":"Timebox: maximum three hours","text":"The Sprint Retrospective concludes the Sprint. It is timeboxed to a maximum of three hours for a one-month Sprint. For shorter Sprints, the event is usually shorter.","pages":[10],"refs":["b121"],"kind":"text","parent":"sprint-retrospective","color":"#a1493e","leafCount":1},"sprint-retrospective":{"id":"sprint-retrospective","title":"Sprint Retrospective","children":["b118","b119","b120","b121"],"refs":["b117"],"parent":"scrum-events","color":"#a1493e","pages":[10],"leafCount":4},"b081":{"id":"b081","title":"Formal opportunities to inspect and adapt","text":"The Sprint is a container for all other events. Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts. These events are specifically designed to enable the transparency required. Failure to operate any events as prescribed results in lost opportunities to inspect and adapt. Events are used in Scrum to create regularity and to minimize the need for meetings not defined in Scrum. Optimally, all events are held at the same time and place to reduce complexity.","pages":[7],"refs":["b081"],"kind":"text","parent":"scrum-events","color":"#a1493e","leafCount":1},"scrum-events":{"id":"scrum-events","title":"Scrum Events","children":["b081","the-sprint","sprint-planning","daily-scrum","sprint-review","sprint-retrospective"],"refs":["b080"],"color":"#a1493e","parent":"home","pages":[7,8,9,10],"leafCount":33},"b134":{"id":"b134","title":"Future state; target for planning","text":"The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against. The Product Goal is in the Product Backlog. The rest of the Product Backlog emerges to define “what” will fulfill the Product Goal.","pages":[11],"refs":["b134"],"kind":"text","parent":"commitment-product-goal","color":"#71558d","leafCount":1},"b135":{"id":"b135","title":"What is a product?","text":"A product is a vehicle to deliver value. It has a clear boundary, known stakeholders, well-defined users or customers. A product could be a service, a physical product, or something more abstract.","pages":[11],"refs":["b135"],"kind":"text","parent":"commitment-product-goal","color":"#71558d","leafCount":1},"b136":{"id":"b136","title":"One long-term objective at a time","text":"The Product Goal is the long-term objective for the Scrum Team. They must fulfill (or abandon) one objective before taking on the next.","pages":[11],"refs":["b136"],"kind":"text","parent":"commitment-product-goal","color":"#71558d","leafCount":1},"commitment-product-goal":{"id":"commitment-product-goal","title":"Commitment: Product Goal","children":["b134","b135","b136"],"refs":["b133"],"parent":"product-backlog","color":"#71558d","pages":[11],"leafCount":3},"b130":{"id":"b130","title":"An emergent, ordered list","text":"The Product Backlog is an emergent, ordered list of what is needed to improve the product. It is the single source of work undertaken by the Scrum Team.","pages":[10],"refs":["b130"],"kind":"text","parent":"product-backlog","color":"#71558d","leafCount":1},"b131":{"id":"b131","title":"Readiness and ongoing refinement","text":"Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event. They usually acquire this degree of transparency after refining activities. Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items. This is an ongoing activity to add details, such as a description, order, and size. Attributes often vary with the domain of work.","pages":[10],"refs":["b131"],"kind":"text","parent":"product-backlog","color":"#71558d","leafCount":1},"b132":{"id":"b132","title":"Developers are responsible for sizing","text":"The Developers who will be doing the work are responsible for the sizing. The Product Owner may influence the Developers by helping them understand and select trade-offs.","pages":[11],"refs":["b132"],"kind":"text","parent":"product-backlog","color":"#71558d","leafCount":1},"product-backlog":{"id":"product-backlog","title":"Product Backlog","children":["b130","b131","b132","commitment-product-goal"],"refs":["b129"],"parent":"scrum-artifacts","color":"#71558d","pages":[10,11],"leafCount":6},"b141":{"id":"b141","title":"One objective; flexibility in the work","text":"The Sprint Goal is the single objective for the Sprint. Although the Sprint Goal is a commitment by the Developers, it provides flexibility in terms of the exact work needed to achieve it. The Sprint Goal also creates coherence and focus, encouraging the Scrum Team to work together rather than on separate initiatives.","pages":[11],"refs":["b141"],"kind":"text","parent":"commitment-sprint-goal","color":"#71558d","leafCount":1},"b142":{"id":"b142","title":"Create the goal; negotiate scope","text":"The Sprint Goal is created during the Sprint Planning event and then added to the Sprint Backlog. As the Developers work during the Sprint, they keep the Sprint Goal in mind. If the work turns out to be different than they expected, they collaborate with the Product Owner to negotiate the scope of the Sprint Backlog within the Sprint without affecting the Sprint Goal.","pages":[11],"refs":["b142"],"kind":"text","parent":"commitment-sprint-goal","color":"#71558d","leafCount":1},"commitment-sprint-goal":{"id":"commitment-sprint-goal","title":"Commitment: Sprint Goal","children":["b141","b142"],"refs":["b140"],"parent":"sprint-backlog","color":"#71558d","pages":[11],"leafCount":2},"b138":{"id":"b138","title":"Why, what and how","text":"The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how).","pages":[11],"refs":["b138"],"kind":"text","parent":"sprint-backlog","color":"#71558d","leafCount":1},"b139":{"id":"b139","title":"A living plan by and for Developers","text":"The Sprint Backlog is a plan by and for the Developers. It is a highly visible, real-time picture of the work that the Developers plan to accomplish during the Sprint in order to achieve the Sprint Goal. Consequently, the Sprint Backlog is updated throughout the Sprint as more is learned. It should have enough detail that they can inspect their progress in the Daily Scrum.","pages":[11],"refs":["b139"],"kind":"text","parent":"sprint-backlog","color":"#71558d","leafCount":1},"sprint-backlog":{"id":"sprint-backlog","title":"Sprint Backlog","children":["b138","b139","commitment-sprint-goal"],"refs":["b137"],"parent":"scrum-artifacts","color":"#71558d","pages":[11],"leafCount":4},"b148":{"id":"b148","title":"The required quality measures","text":"The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.","pages":[12],"refs":["b148"],"kind":"text","parent":"commitment-definition-of-done","color":"#71558d","leafCount":1},"b149":{"id":"b149","title":"When an Increment is born","text":"The moment a Product Backlog item meets the Definition of Done, an Increment is born.","pages":[12],"refs":["b149"],"kind":"text","parent":"commitment-definition-of-done","color":"#71558d","leafCount":1},"b150":{"id":"b150","title":"Unfinished work returns to the backlog","text":"The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment. If a Product Backlog item does not meet the Definition of Done, it cannot be released or even presented at the Sprint Review. Instead, it returns to the Product Backlog for future consideration.","pages":[12],"refs":["b150"],"kind":"text","parent":"commitment-definition-of-done","color":"#71558d","leafCount":1},"b151":{"id":"b151","title":"Organizational standards and team definition","text":"If the Definition of Done for an increment is part of the standards of the organization, all Scrum Teams must follow it as a minimum. If it is not an organizational standard, the Scrum Team must create a Definition of Done appropriate for the product.","pages":[12],"refs":["b151"],"kind":"text","parent":"commitment-definition-of-done","color":"#71558d","leafCount":1},"b152":{"id":"b152","title":"Developers and multiple teams comply","text":"The Developers are required to conform to the Definition of Done. If there are multiple Scrum Teams working together on a product, they must mutually define and comply with the same Definition of Done.","pages":[12],"refs":["b152"],"kind":"text","parent":"commitment-definition-of-done","color":"#71558d","leafCount":1},"commitment-definition-of-done":{"id":"commitment-definition-of-done","title":"Commitment: Definition of Done","children":["b148","b149","b150","b151","b152"],"refs":["b147"],"parent":"increment","color":"#71558d","pages":[12],"leafCount":5},"b144":{"id":"b144","title":"Usable, additive and verified","text":"An Increment is a concrete stepping stone toward the Product Goal. Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together. In order to provide value, the Increment must be usable.","pages":[11],"refs":["b144"],"kind":"text","parent":"increment","color":"#71558d","leafCount":1},"b145":{"id":"b145","title":"Multiple Increments; release before Review","text":"Multiple Increments may be created within a Sprint. The sum of the Increments is presented at the Sprint Review thus supporting empiricism. However, an Increment may be delivered to stakeholders prior to the end of the Sprint. The Sprint Review should never be considered a gate to releasing value.","pages":[12],"refs":["b145"],"kind":"text","parent":"increment","color":"#71558d","leafCount":1},"b146":{"id":"b146","title":"Only Done work is part of an Increment","text":"Work cannot be considered part of an Increment unless it meets the Definition of Done.","pages":[12],"refs":["b146"],"kind":"text","parent":"increment","color":"#71558d","leafCount":1},"increment":{"id":"increment","title":"Increment","children":["b144","b145","b146","commitment-definition-of-done"],"refs":["b143"],"parent":"scrum-artifacts","color":"#71558d","pages":[11,12],"leafCount":8},"b123":{"id":"b123","title":"Transparency of work and value","text":"Scrum’s artifacts represent work or value. They are designed to maximize transparency of key information. Thus, everyone inspecting them has the same basis for adaptation.","pages":[10],"refs":["b123"],"kind":"text","parent":"scrum-artifacts","color":"#71558d","leafCount":1},"b124":{"id":"b124","title":"A commitment for every artifact","text":"Each artifact contains a commitment to ensure it provides information that enhances transparency and focus against which progress can be measured:","pages":[10],"refs":["b124"],"kind":"text","parent":"artifacts-and-their-commitments","color":"#71558d","leafCount":1},"b125":{"id":"b125","title":"Product Backlog → Product Goal","text":"● For the Product Backlog it is the Product Goal.","pages":[10],"refs":["b125"],"kind":"text","parent":"artifacts-and-their-commitments","color":"#71558d","leafCount":1},"b126":{"id":"b126","title":"Sprint Backlog → Sprint Goal","text":"● For the Sprint Backlog it is the Sprint Goal.","pages":[10],"refs":["b126"],"kind":"text","parent":"artifacts-and-their-commitments","color":"#71558d","leafCount":1},"b127":{"id":"b127","title":"Increment → Definition of Done","text":"● For the Increment it is the Definition of Done.","pages":[10],"refs":["b127"],"kind":"text","parent":"artifacts-and-their-commitments","color":"#71558d","leafCount":1},"b128":{"id":"b128","title":"Reinforce empiricism and values","text":"These commitments exist to reinforce empiricism and the Scrum values for the Scrum Team and their stakeholders.","pages":[10],"refs":["b128"],"kind":"text","parent":"artifacts-and-their-commitments","color":"#71558d","leafCount":1},"artifacts-and-their-commitments":{"id":"artifacts-and-their-commitments","title":"Artifacts and their commitments","children":["b124","b125","b126","b127","b128"],"refs":[],"parent":"scrum-artifacts","color":"#71558d","pages":[10],"leafCount":5},"scrum-artifacts":{"id":"scrum-artifacts","title":"Scrum Artifacts","children":["b123","artifacts-and-their-commitments","product-backlog","sprint-backlog","increment"],"refs":["b122"],"color":"#71558d","parent":"home","pages":[10,11,12],"leafCount":24},"b003":{"id":"b003","title":"Origin and evolution","text":"We developed Scrum in the early 1990s. We wrote the first version of the Scrum Guide in 2010 to help people worldwide understand Scrum. We have evolved the Guide since then through small, functional updates. Together, we stand behind it.","pages":[1],"refs":["b003"],"kind":"text","parent":"purpose-of-the-scrum-guide","color":"#626b67","leafCount":1},"b004":{"id":"b004","title":"Every element serves a purpose","text":"The Scrum Guide contains the definition of Scrum. Each element of the framework serves a specific purpose that is essential to the overall value and results realized with Scrum. Changing the core design or ideas of Scrum, leaving out elements, or not following the rules of Scrum, covers up problems and limits the benefits of Scrum, potentially even rendering it useless.","pages":[1],"refs":["b004"],"kind":"text","parent":"purpose-of-the-scrum-guide","color":"#626b67","leafCount":1},"b005":{"id":"b005","title":"Scrum beyond software","text":"We follow the growing use of Scrum within an ever-growing complex world. We are humbled to see Scrum being adopted in many domains holding essentially complex work, beyond software product development where Scrum has its roots. As Scrum’s use spreads, developers, researchers, analysts, scientists, and other specialists do the work. We use the word “developers” in Scrum not to exclude, but to simplify. If you get value from Scrum, consider yourself included.","pages":[1],"refs":["b005"],"kind":"text","parent":"purpose-of-the-scrum-guide","color":"#626b67","leafCount":1},"b006":{"id":"b006","title":"Context-specific practices","text":"As Scrum is being used, patterns, processes, and insights that fit the Scrum framework as described in this document, may be found, applied and devised. Their description is beyond the purpose of the Scrum Guide because they are context sensitive and differ widely between Scrum uses. Such tactics for using within the Scrum framework vary widely and are described elsewhere.","pages":[1],"refs":["b006"],"kind":"text","parent":"purpose-of-the-scrum-guide","color":"#626b67","leafCount":1},"b007":{"id":"b007","title":"Authors and publication date","text":"Ken Schwaber & Jeff Sutherland November 2020","pages":[1],"refs":["b007"],"kind":"text","parent":"purpose-of-the-scrum-guide","color":"#626b67","leafCount":1},"purpose-of-the-scrum-guide":{"id":"purpose-of-the-scrum-guide","title":"Purpose of the Scrum Guide","children":["b003","b004","b005","b006","b007"],"refs":["b002"],"parent":"about","color":"#626b67","pages":[1],"leafCount":5},"b154":{"id":"b154","title":"Scrum exists in its entirety","text":"Scrum is free and offered in this Guide. The Scrum framework, as outlined herein, is immutable. While implementing only parts of Scrum is possible, the result is not Scrum. Scrum exists only in its entirety and functions well as a container for other techniques, methodologies, and practices.","pages":[13],"refs":["b154"],"kind":"text","parent":"end-note","color":"#626b67","leafCount":1},"b157":{"id":"b157","title":"People who shaped Scrum","text":"Of the thousands of people who have contributed to Scrum, we should single out those who were instrumental at the start: Jeff Sutherland worked with Jeff McKenna and John Scumniotales, and Ken Schwaber worked with Mike Smith and Chris Martin, and all of them worked together. Many others contributed in the ensuing years and without their help Scrum would not be refined as it is today.","pages":[13],"refs":["b157"],"kind":"text","parent":"people","color":"#626b67","leafCount":1},"people":{"id":"people","title":"People","children":["b157"],"refs":["b156"],"parent":"acknowledgements","color":"#626b67","pages":[13],"leafCount":1},"b159":{"id":"b159","title":"The first formal definition","text":"Ken Schwaber and Jeff Sutherland first co-presented Scrum at the OOPSLA Conference in 1995. It essentially documented the learning that Ken and Jeff gained over the previous few years and made public the first formal definition of Scrum.","pages":[13],"refs":["b159"],"kind":"text","parent":"scrum-guide-history","color":"#626b67","leafCount":1},"b160":{"id":"b160","title":"Thirty-plus years of development","text":"The Scrum Guide documents Scrum as developed, evolved, and sustained for 30-plus years by Jeff Sutherland and Ken Schwaber. Other sources provide patterns, processes, and insights that complement the Scrum framework. These may increase productivity, value, creativity, and satisfaction with the results.","pages":[13],"refs":["b160"],"kind":"text","parent":"scrum-guide-history","color":"#626b67","leafCount":1},"b161":{"id":"b161","title":"Early organizations","text":"The complete history of Scrum is described elsewhere. To honor the first places where it was tried and proven, we recognize Individual Inc., Newspage, Fidelity Investments, and IDX (now GE Medical).","pages":[13],"refs":["b161"],"kind":"text","parent":"scrum-guide-history","color":"#626b67","leafCount":1},"scrum-guide-history":{"id":"scrum-guide-history","title":"Scrum Guide History","children":["b159","b160","b161"],"refs":["b158"],"parent":"acknowledgements","color":"#626b67","pages":[13],"leafCount":3},"acknowledgements":{"id":"acknowledgements","title":"Acknowledgements","children":["people","scrum-guide-history"],"refs":["b155"],"parent":"end-note","color":"#626b67","pages":[13],"leafCount":4},"end-note":{"id":"end-note","title":"End Note","children":["b154","acknowledgements"],"refs":["b153"],"parent":"about","color":"#626b67","pages":[13],"leafCount":5},"b001":{"id":"b001","title":"Cover · November 2020","text":"Ken Schwaber & Jeff Sutherland\n\n\n\n\nThe Scrum Guide\nThe Definitive Guide to Scrum: The Rules of the Game\n\n\n\n\n               November 2020","pages":[0],"refs":["b001"],"kind":"frontmatter","parent":"about","color":"#626b67","leafCount":1},"b010":{"id":"b010","title":"Original table of contents","text":"Purpose of the Scrum Guide .......................................................................................................................... 1\nScrum Definition ......................................................................................................................
